<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>ノート</title>

  <!-- ホーム画面に追加したとき、アプリのように全画面で開く設定 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ノート">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#2f5d8a">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <!-- タブの帯（ライブラリボタン＋開いているノート） -->
  <header id="tabbar">
    <button type="button" id="library-button" class="library-button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      <span>ライブラリ</span>
    </button>
    <div id="tabs" role="tablist"></div>
  </header>

  <!-- 道具の帯 -->
  <header id="toolbar">
    <div class="group" id="tool-group"></div>
    <div class="sep"></div>
    <div class="group" id="color-group"></div>
    <div class="sep"></div>
    <div class="group" id="size-group"></div>
    <div class="sep"></div>
    <div class="group" id="history-group"></div>
    <div class="spacer"></div>
    <button type="button" id="add-page-button" class="text-button">＋ ページ</button>
  </header>

  <!-- バックアップのお知らせ（最後のバックアップから7日たったとき） -->
  <div id="backup-banner" hidden>
    <div>
      <strong>バックアップしましょう。</strong>
      <span id="backup-banner-text"></span>
    </div>
    <div class="banner-buttons">
      <button type="button" id="backup-banner-go" class="primary">バックアップする</button>
      <button type="button" id="backup-banner-later">あとで</button>
    </div>
  </div>

  <!-- ホーム画面に追加していないときの案内 -->
  <div id="install-banner" hidden>
    <div>
      <strong>ホーム画面に追加して使ってください。</strong>
      Safariで開いたままだと、しばらく使わないうちに書いたノートが消されることがあります。
      共有ボタン（四角から上向きの矢印）→「ホーム画面に追加」を選び、ホーム画面のアイコンから開いてください。
    </div>
    <button type="button">閉じる</button>
  </div>

  <!-- ノート（下：確定した線、上：書いている途中の線） -->
  <main id="stage">
    <canvas id="base-canvas"></canvas>
    <canvas id="ink-canvas"></canvas>
  </main>

  <!-- なげなわの操作の帯（#stage の中に入れると、押した操作が「書き始め」になってしまうので外に置く） -->
  <div id="lasso-bar" hidden>
    <button type="button" data-act="copy">コピー</button>
    <button type="button" data-act="paste">貼り付け</button>
    <button type="button" data-act="delete" class="danger-text">削除</button>
    <span class="lasso-colors" aria-label="色を変える"></span>
  </div>

  <!-- ボードページを開いているときの帯 -->
  <div id="board-bar" hidden>
    <button type="button" id="board-back">← ノートページに戻る</button>
    <span class="board-label">ボードページ</span>
  </div>

  <div id="page-indicator">
    <span id="page-number">1 / 1</span>
    <button type="button" id="page-list-button">ページ一覧</button>
  </div>
  <div id="add-page-menu" hidden></div>
  <!-- ライブラリ・ページ一覧・設定（ノート画面から開き、閉じるとノート画面に戻る） -->
  <section id="library" class="screen" hidden></section>
  <section id="page-list" class="screen" hidden></section>
  <section id="settings" class="screen" hidden></section>
  <div id="dialog-root"></div>
  <div id="toast" role="status"></div>
  <div id="fatal" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
